# Remap prefix to <C-a>
unbind-key C-b
set-option -g prefix C-a
# Send C-a to the running program by pressing it again
bind-key -N "Send the prefix key" C-a send-prefix

# Vim all the things
set-option -g status-keys vi
set-option -wg mode-keys vi

set-option -s extended-keys on
set-option -g allow-passthrough on
set-option -ga update-environment TERM_PROGRAM

# Make new panes open with the same working directory.
bind-key -N "Create a new window in the current directory" c new-window -c '#{pane_current_path}'
# Though sometimes I want to open them in my home directory (and I don't use
# customize-mode).
unbind-key C
bind-key -N "Create a new window in the home directory" C new-window

# Make the splits behave like Vim's (with the same directory behavior as opening
# new windows).
unbind-key %
bind-key -N "Split window vertically, in the current directory" s split-window -v -c '#{pane_current_path}'
bind-key -N "Split window vertically" S split-window -v
bind-key -N "Split window horizontally, in the current directory" v split-window -h -c '#{pane_current_path}'
bind-key -N "Split window horizontally" V split-window -h

# Move around panes like Vim, making tmux smart enough to switch between Vim and
# tmux splits. Anytime an application uses one of the bindings, it will need to
# be added to the command pattern, otherwise tmux will swallow the keys.
bind-key -N "Select the pane to the left (through Vim splits)" -n C-h if-shell -F '#{m/ri:vim|mutt,#{pane_current_command}}' { send-keys C-h } { select-pane -L }
bind-key -N "Select the pane below (through Vim splits)" -n C-j if-shell -F '#{m/ri:vim|mutt,#{pane_current_command}}' { send-keys C-j } { select-pane -D }
bind-key -N "Select the pane above (through Vim splits)" -n C-k if-shell -F '#{m/ri:vim|mutt,#{pane_current_command}}' { send-keys C-k } { select-pane -U }
bind-key -N "Select the pane to the right (through Vim splits)" -n C-l if-shell -F '#{m/ri:vim|mutt,#{pane_current_command}}' { send-keys C-l } { select-pane -R }
bind-key -N "Select the previously active pane (through Vim splits)" -n C-\\ if-shell -F '#{m/ri:vim|mutt,#{pane_current_command}}' { send-keys C-\\ } { select-pane -l }
unbind-key h
unbind-key j
unbind-key k
bind-key -N "Select the previously current window" l last-window

bind-key -N "Swap the active pane with the pane above" H swap-pane -U
bind-key -N "Swap the active pane with the pane below" L swap-pane -D

# Resize panes like Vim
bind-key -N "Resize the pane left by 5" < resize-pane -L 5
bind-key -N "Resize the pane right by 5" > resize-pane -R 5
bind-key -N "Resize the pane up by 5" + resize-pane -U 5
bind-key -N "Resize the pane down by 5" - resize-pane -D 5

# Send keys to all the panes for the current window.
bind-key -N "Toggle sending input to all panes in the window" y set-option -w synchronize-panes

# Turn off escape delay
set-option -sg escape-time 0

# Resource the config
bind-key -N "Reload the configuration" r source-file ~/.config/tmux/tmux.conf \; display "Resourced tmux configuration"

# Left-most tab should be the left-most key
set-option -g base-index 1
set-option -g pane-base-index 1

set-option -g default-terminal "tmux-256color"

set-option -wg automatic-rename on

# Tick tock
set-option -wg clock-mode-style 24

# Fix the mouse
set-option -g mouse on

# Copy/paste
bind-key -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind-key -N "Copy the selection, and exit copy mode" -T copy-mode-vi y send -X copy-selection-and-cancel
# Sometimes I don't want to drop back down to the prompt after yanking.
bind-key -N "Copy the selection" -T copy-mode-vi Y send -X copy-selection
bind-key -N "Paste from the clipboard" P run-shell "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"

# Open some applications in a popup.
# htop
bind-key -N "Show htop in a popup" -n M-h display-popup -E -h 90% -w 90% "htop"

set-option -g history-limit 50000

bind-key -N "Choose a session from a list" o choose-session

# Enable focus events for Neovim.
set-option -g focus-events on

set-option -g @plugin 'https://github.com/tmux-plugins/tpm-redux'
set-option -g @plugin 'https://github.com/tmux-plugins/tmux-battery'
set-option -g @plugin 'https://github.com/tmux-plugins/tmux-cpu'
set-option -g @plugin 'https://github.com/tmux-plugins/tmux-online-status'
set-option -g @plugin 'https://github.com/catppuccin/tmux'

# Configure Catppuccin
set-option -g @catppuccin_flavor "macchiato"
set-option -g @catppuccin_status_background "none"
set-option -g @catppuccin_window_status_style "none"
set-option -g @catppuccin_pane_status_enabled "off"
set-option -g @catppuccin_pane_border_status "off"

# Configure Online
set-option -g @online_icon "ok"
set-option -g @offline_icon "nok"

# Detect the terminal emulator from its environment variable.
%if "#{==:#{TERM_PROGRAM},ghostty}"
    set-option -g @terminal_icon "👻"
%else
    set-option -g @terminal_icon ""
%endif

# status left look and feel
set-option -g status-left-length 100
set-option -g status-left ""
set-option -ga status-left "#{?client_prefix,#[bg=#{@thm_red}#,fg=#{@thm_bg}#,bold],#[fg=#{@thm_green}]} #{@terminal_icon} #S "

set-option -g @cpu_low_fg_color "#[fg=#{@thm_green}]"
set-option -g @cpu_medium_fg_color "#[fg=#{@thm_yellow}]"
set-option -g @cpu_high_fg_color "#[fg=#{@thm_red}]"

set-option -g @ram_low_fg_color "#[fg=#{@thm_green}]"
set-option -g @ram_medium_fg_color "#[fg=#{@thm_yellow}]"
set-option -g @ram_high_fg_color "#[fg=#{@thm_red}]"

set-option -g @batt_remain_short "true"

# status right look and feel
set-option -g status-right-length 100
set-option -g status-right ""
set-option -ga status-right "#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"
set-option -ga status-right "#[fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set-option -ga status-right "#{ram_fg_color}   #{ram_percentage} "
set-option -ga status-right "#[fg=#{@thm_overlay_0}, none]│"
set-option -ga status-right "#{cpu_fg_color}  #{cpu_percentage} "
set-option -ga status-right "#[fg=#{@thm_overlay_0}, none]│"
set-option -ga status-right "#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red}] 󰖪 off }"
set-option -ga status-right "#[fg=#{@thm_overlay_0}, none]│"
set-option -ga status-right "#{?#{!=:#{battery_percentage},},#{?#{e|>=:10,#{battery_percentage}},#[fg=#{@thm_red}],#[fg=#{@thm_pink}]} #{battery_icon} #{battery_percentage} #{battery_remain}, } "
set-option -ga status-right "#[fg=#{@thm_overlay_0}, none]│"
set-option -ga status-right "#[fg=#{@thm_blue}] 󰭦 %a %b %-e 󰅐 %-l:%M%p "

# Configure Tmux
set-option -g status-position top

# pane border look and feel
set-option -wg pane-border-status top
set-option -wg pane-border-format ""

# window look and feel
set-option -wg automatic-rename on

set-option -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set-option -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set-option -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set-option -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"
set-option -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set-option -g window-status-last-style "fg=#{@thm_blue}"
set-option -gF window-status-separator "#[fg=#{@thm_overlay_0}]│"
set-option -g window-status-style "fg=#{@thm_rosewater}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm-redux/tpm'
